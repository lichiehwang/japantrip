<title>日本跨年之旅｜東京・河口湖・京都</title>

<style>
:root{--paper:#FFFCF6;--ink:#3E3A39;--coral:#F2A497;--yellow:#F6D27A;--sky:#A8D3E6;--green:#B9DAA5;--line:3px solid var(--ink);--r:24px;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Huninn","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.7;font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:20}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:19;background:var(--paper);border-bottom:var(--line);display:flex;gap:6px;padding:10px 12px;overflow-x:auto;justify-content:center}
nav button{font:inherit;color:var(--ink);background:var(--paper);border:var(--line);border-radius:999px;padding:4px 14px;cursor:pointer;white-space:nowrap}
nav button:nth-child(1){background:var(--coral)}nav button:nth-child(2){background:var(--sky)}nav button:nth-child(3){background:var(--yellow)}nav button:nth-child(4){background:var(--green)}nav button:nth-child(5){background:var(--coral)}
button:focus-visible,input:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
main{max-width:640px;margin:0 auto;padding:0 16px 48px}
section{padding-top:28px}
h1,h2,h3,p{margin:0}
h2{font-size:1.5rem;margin-bottom:14px;display:inline-block;background:var(--yellow);border:var(--line);border-radius:999px;padding:0 18px}
.card{background:var(--paper);border:var(--line);border-radius:var(--r);padding:16px}
/* hero */
.hero{text-align:center}
.scene{border:var(--line);border-radius:32px;overflow:hidden;background:var(--sky);line-height:0}
.scene svg{width:100%;height:auto}
h1{font-size:2rem;line-height:1.3;margin:18px 0 4px}
.sub{font-size:.95rem}
.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.count div{border:var(--line);border-radius:18px;padding:6px 0;line-height:1.2}
.count div:nth-child(1){background:var(--coral)}.count div:nth-child(2){background:var(--yellow)}.count div:nth-child(3){background:var(--sky)}.count div:nth-child(4){background:var(--green)}
.count b{display:block;font-size:1.7rem;font-weight:400}.count span{font-size:.8rem}
#cdlabel{margin-top:10px}
/* flights */
.flight{margin-bottom:14px;position:relative}
.flight:nth-of-type(1){background:#FBE6E1}.flight:nth-of-type(2){background:#E4F1F7}
.flight .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.pill{border:var(--line);border-radius:999px;padding:0 12px;background:var(--yellow);font-size:.9rem;white-space:nowrap}
.route{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
.route b{font-size:2rem;font-weight:400;line-height:1.1;display:block}
.route small{display:block;font-size:.8rem}
.route svg{width:54px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:.85rem}
.meta span{background:var(--paper);border:2px solid var(--ink);border-radius:999px;padding:0 10px}
/* days */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-snap-type:x proximity}
.tab{flex:0 0 auto;font:inherit;color:var(--ink);background:var(--paper);border:var(--line);border-radius:20px;padding:2px 12px;text-align:center;line-height:1.3;cursor:pointer;scroll-snap-align:center}
.tab small{display:block;font-size:.72rem}.tab b{font-weight:400;font-size:1.05rem}
.tab[aria-selected=true]{background:var(--coral);animation:bounce .55s cubic-bezier(.3,1.6,.5,1)}
.dayhead{background:var(--green);margin-bottom:18px}
.dayhead h3{font-size:1.25rem;line-height:1.4}
.dayhead p{font-size:.9rem;margin-top:2px}
.tl{list-style:none;margin:0;padding:0 0 0 26px;position:relative}
.tl::before{content:"";position:absolute;left:8px;top:8px;bottom:8px;border-left:3px dashed var(--ink)}
.tl li{position:relative;margin-bottom:14px;animation:pop .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*70ms)}
.tl li::before{content:"";position:absolute;left:-26px;top:14px;width:19px;height:19px;border-radius:50%;border:var(--line);background:var(--sky)}
.tl li.must::before{background:var(--coral)}
.time{display:inline-block;font-size:.85rem;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:0 10px;margin-bottom:4px}
.tl .card{padding:10px 14px}
.tl .card.must{background:#FDEEEA}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:.78rem;border:2px solid var(--ink);border-radius:999px;padding:0 9px;line-height:1.6}
.t-air{background:var(--sky)}.t-rail{background:var(--coral)}.t-bus{background:var(--yellow)}.t-walk{background:var(--green)}
.must-b{font-size:.78rem;background:var(--coral);border:2px solid var(--ink);border-radius:999px;padding:0 9px;margin-left:6px;white-space:nowrap;display:inline-block;transform:rotate(-4deg)}
.note{font-size:.85rem;margin-top:4px;opacity:.85}
/* todo */
.todo{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.todo label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;border:var(--line);border-radius:20px;padding:10px 14px;background:var(--paper)}
.todo input{appearance:none;flex:0 0 26px;height:26px;margin:2px 0 0;border:var(--line);border-radius:9px;background:var(--paper);cursor:pointer;display:grid;place-items:center}
.todo input:checked{background:var(--green)}
.todo input:checked::after{content:"";width:6px;height:12px;border:solid var(--ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px);animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
.todo input:checked+span{text-decoration:line-through;opacity:.55}
.prog{margin-bottom:12px;font-size:.9rem}
.bar{height:20px;border:var(--line);border-radius:999px;overflow:hidden;margin-top:4px;background:var(--paper)}
.bar i{display:block;height:100%;width:0;background:var(--yellow);border-right:3px solid var(--ink);transition:width .4s cubic-bezier(.3,1.4,.5,1)}
/* hotels */
.hotels{display:grid;gap:14px}
.hotel:nth-child(odd){background:#E4F1F7}.hotel:nth-child(even){background:#FDF3D6}
.hotel h3{font-size:1.1rem;line-height:1.4}
.hotel .en{font-size:.8rem}
.hotel .n{float:right;margin-left:8px}
.hotel p{font-size:.88rem;margin-top:4px}
footer{text-align:center;padding:24px 0 8px;font-size:.9rem}
@keyframes bounce{0%{transform:scale(.8) translateY(6px)}60%{transform:scale(1.12) translateY(-4px)}100%{transform:none}}
@keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.94)}100%{opacity:1;transform:none}}
@keyframes drift{0%{transform:translateX(-40px)}100%{transform:translateX(420px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes fall{0%{transform:translateY(-10px)}100%{transform:translateY(250px)}}
@keyframes zoom{0%{transform:translateX(-160px)}100%{transform:translateX(440px)}}
@keyframes fly{0%{transform:translate(-60px,6px)}100%{transform:translate(430px,-10px)}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.cloud{animation:drift 38s linear infinite}.cloud.b{animation-duration:55s;animation-delay:-20s}
.plane{animation:fly 16s linear infinite}
.train{animation:zoom 9s linear infinite}
.sun{transform-origin:290px 52px;animation:bob 4s ease-in-out infinite}
.lantern{transform-box:fill-box;transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite}
.snow circle{animation:fall 7s linear infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

['12/30 – 1/1（2 晚）','京都東山希爾頓逸林酒店','DoubleTree by Hilton Kyoto Higashiyama','1-45, Honmachi, Higashiyama-Ku, Kyoto',''],
['1/1 – 1/2（1 晚）','京都站希爾頓逸林酒店','DoubleTree by Hilton Kyoto Station','15 Higashi Kujo Nishi Iwamotocho, Minami-ku, Kyoto','']];
var RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function $(i){return document.getElementById(i)}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
// nav
document.querySelectorAll('nav button').forEach(function(b){b.addEventListener('click',function(){$(b.dataset.go).scrollIntoView({behavior:RM?'auto':'smooth'})})});
// countdown
var T=new Date('2026-12-25T07:55:00+08:00').getTime();
function tick(){var s=Math.floor((T-Date.now())/1000);
if(s<=0){['d','h','m','s'].forEach(function(k){$('cd-'+k).textContent='0'});$('cdlabel').textContent='出發囉，旅途愉快！';return}
$('cd-d').textContent=Math.floor(s/86400);$('cd-h').textContent=Math.floor(s%86400/3600);$('cd-m').textContent=Math.floor(s%3600/60);$('cd-s').textContent=s%60}
tick();setInterval(tick,1000);
// days
var cur=0;
function renderTabs(){$('tabs').innerHTML=D.map(function(x,n){return '<button class="tab" role="tab" aria-selected="'+(n===cur)+'" data-n="'+n+'"><small>Day '+(n+1)+'</small><b>'+x.d+'</b><small>'+x.w+'</small></button>'}).join('');
document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){cur=+b.dataset.n;renderTabs();renderDay();var t=document.querySelector('.tab[aria-selected=true]');if(t)t.scrollIntoView({inline:'center',block:'nearest',behavior:RM?'auto':'smooth'})})})}
function renderDay(){var x=D[cur];
$('day').innerHTML='<div class="card dayhead"><h3>Day '+(cur+1)+'｜'+x.d+'（'+x.w+'）'+esc(x.t)+'</h3><p>住宿：'+esc(x.h)+'</p></div><ol class="tl">'+x.i.map(function(e,n){
var tg=(e[2]||'').split('').map(function(k){return '<span class="tag '+TAGS[k][1]+'">'+TAGS[k][0]+'</span>'}).join('');
return '<li class="'+(e[3]?'must':'')+'" style="--i:'+n+'"><span class="time">'+esc(e[0])+'</span><div class="card '+(e[3]?'must':'')+'">'+esc(e[1])+(e[3]?'<span class="must-b">必去</span>':'')+(tg?'<div class="tags">'+tg+'</div>':'')+(e[4]?'<p class="note">'+esc(e[4])+'</p>':'')+'</div></li>'}).join('')+'</ol>'}
renderTabs();renderDay();
// todo
var KEY='jp-trip-todo',st={};
try{st=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){st={}}
function prog(){var n=0;TODO.forEach(function(_,i){if(st[i])n++});$('progtxt').textContent='已完成 '+n+' / '+TODO.length;$('progbar').style.width=(n/TODO.length*100)+'%'}
$('todolist').innerHTML=TODO.map(function(t,i){return '<li><label><input type="checkbox" data-i="'+i+'"'+(st[i]?' checked':'')+'><span>'+esc(t)+'</span></label></li>'}).join('');
$('todolist').addEventListener('change',function(e){st[e.target.dataset.i]=e.target.checked;try{localStorage.setItem(KEY,JSON.stringify(st))}catch(x){}prog()});
prog();
// hotels
$('hotels').innerHTML=H.map(function(h){return '<div class="card hotel"><span class="pill n">'+h[0]+'</span><h3>'+h[1]+'</h3>'+(h[2]?'<div class="en">'+h[2]+'</div>':'')+'<p>地址：'+h[3]+'</p>'+(h[4]?'<p>電話：'+h[4]+'</p>':'')+'</div>'}).join('');
</script>
